<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Cards</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/c0dede222e.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    
    <!-- Card 1 -->
    <div class="card">
      <div class="top">
        <div class="social">
          <i class="fa-brands fa-facebook"></i>
        </div>
        <div class="social">
          <i class="fa-brands fa-twitter"></i>
        </div>
        <div class="social">
          <i class="fa-brands fa-github"></i>
        </div>
        <img src="./assets/nani1.png" alt="profile" class="image">
      </div>
      <h2>Prem Shahi</h2>
      <h4><b>Web Developer</b></h4>
      <div class="star">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-regular fa-star"></i>
      </div>
      <div class="buttons">
        <button class="btn">About Me</button>
        <button class="btn">Hire Me</button>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div class="top">
        <div class="social">
          <i class="fa-brands fa-facebook"></i>
        </div>
        <div class="social">
          <i class="fa-brands fa-twitter"></i>
        </div>
        <div class="social">
          <i class="fa-brands fa-github"></i>
        </div>
        <img src="./assets/keerthi.png" alt="profile" class="image">
      </div>
      <h2>Deepa Chand</h2>
      <h4><b>App Developer</b></h4>
      <div class="star">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-regular fa-star"></i>
        <i class="fa-regular fa-star"></i>
      </div>
      <div class="buttons">
        <button class="btn">About Me</button>
        <button class="btn">Hire Me</button>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card">
      <div class="top">
        <div class="social">
          <i class="fa-brands fa-facebook"></i>
        </div>
        <div class="social">
          <i class="fa-brands fa-twitter"></i>
        </div>
        <div class="social">
          <i class="fa-brands fa-github"></i>
        </div>
        <img src="./assets/sai pallavi.png" alt="profile" class="image">
      </div>
      <h2>Praka Shahi</h2>
      <h4><b>Photographer</b></h4>
      <div class="star">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-regular fa-star"></i>
      </div>
      <div class="buttons">
        <button class="btn">About Me</button>
        <button class="btn">Hire Me</button>
      </div>
    </div>

  </div>
</body>
</html>
